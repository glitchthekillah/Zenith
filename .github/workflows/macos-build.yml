name: macOS builds

on:
  push:
    branches: [mac]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to build
        required: false
        default: mac
        type: string

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Add both Mac CPU targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install JavaScript dependencies
        run: |
          npm ci
          node scripts/build-native-video.mjs
      - name: Build universal app and disk image (unsigned)
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Collect
        run: |
          mkdir mac-release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg mac-release/
          cd mac-release && shasum -a 256 *.dmg > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenith-macos-universal
          path: mac-release/*
          if-no-files-found: error
          retention-days: 7
